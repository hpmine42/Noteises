<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noteises – Notizen &amp; Checklisten</title>
<meta name="description" content="Noteises – mobile Notizen- und Checklisten-App in einer HTML-Datei: eigene Labels, Checklisten, Suche, Export. Läuft komplett offline und ist als App installierbar.">
<meta name="theme-color" id="metaTheme" content="#f4f5fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noteises">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./noteises-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><path d='M14 2v6h6'/><path d='M16 13H8'/><path d='M16 17H8'/><path d='M10 9H8'/></svg>">
<style>
/* ================= Grundlagen ================= */
:root{
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  --bg:#f4f5fa; --bg2:#eceef5;
  --panel:#ffffff; --panel2:#f7f8fc; --panel3:#eef0f6;
  --border:#e8eaf2; --border2:#d8dbe6;
  --text:#141822; --muted:#5c6573; --faint:#9aa2b0;
  --accent:#4f46e5; --accent2:#7c3aed; --accent-soft:#eef0ff; --accent-text:#fff;
  --danger:#e11d48; --danger-soft:#ffe9ef;
  --ok:#10b981;
  --shadow-sm:0 1px 2px rgba(20,24,40,.05);
  --shadow:0 1px 3px rgba(20,24,40,.05), 0 6px 18px rgba(20,24,40,.07);
  --shadow-lg:0 12px 40px rgba(20,24,40,.16);
  --r:18px;
  --ease:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --kb:0px; /* Tastatur-Höhe (wird per visualViewport gesetzt) */
}
[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1117; --bg2:#0a0d12;
  --panel:#161b25; --panel2:#1b2130; --panel3:#222a3c;
  --border:#242c3d; --border2:#333d53;
  --text:#eef1f8; --muted:#9aa4b8; --faint:#667085;
  --accent:#6366f1; --accent2:#8b5cf6; --accent-soft:rgba(99,102,241,.16); --accent-text:#fff;
  --danger:#fb7185; --danger-soft:rgba(251,113,133,.12);
  --ok:#34d399;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  --shadow-lg:0 14px 44px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);background:var(--bg2);color:var(--text);
  font-size:15px;line-height:1.5;overflow:hidden;
  transition:background .3s,color .3s;
  -webkit-touch-callout:none;
}
::selection{background:rgba(99,102,241,.3)}
[hidden]{display:none !important}
button{font-family:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;border:0;outline:0;background:transparent;color:inherit}
::-webkit-scrollbar{width:0;height:0}

.app{
  position:relative;max-width:560px;margin:0 auto;height:100dvh;height:100vh;
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);
}
@media(min-width:620px){
  .app{border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:0 0 60px rgba(20,24,40,.08)}
}
.no-scroll{overflow:hidden !important}

/* ================= Kopfbereich ================= */
.topbar{
  flex:none;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(8px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--border);
  z-index:10;
}
.t-row1{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logoicon{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 12px rgba(99,102,241,.4);
}
.logoicon svg{width:17px;height:17px}
.logoname{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.ibtn{
  width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background .15s,color .15s;flex:none;
}
.ibtn:active{background:var(--panel3);transform:scale(.92)}
.ibtn svg{width:21px;height:21px}
.searchwrap{position:relative;margin-top:10px}
.searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint);pointer-events:none}
#search{
  width:100%;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:11px 40px 11px 40px;font-size:15px;color:var(--text);
  box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
#search::placeholder{color:var(--faint)}
#searchClear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:10px;display:none;align-items:center;justify-content:center;color:var(--faint);
}
#searchClear:active{background:var(--panel3);color:var(--text)}
#searchClear svg{width:15px;height:15px;position:static;transform:none}

/* ================= Notizliste ================= */
#listView{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(150px + var(--safe-b) + var(--kb,0px));position:relative}
.sec-title{
  display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);padding:14px 6px 8px;
}
.sec-title .n{background:var(--panel3);border-radius:999px;padding:1px 8px;font-size:10px}

/* Karte mit roter Lösch-Fläche dahinter (Gmail-Stil) */
.card{
  position:relative;background:var(--danger);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm);
  touch-action:pan-y;user-select:none;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
.card:active{transform:scale(.985);box-shadow:var(--shadow)}
/* Lösch-Fläche links sichtbar (rot) & Pin-Fläche rechts (Akzent) */
.del-reveal{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  color:#fff;opacity:0;transition:opacity .15s;pointer-events:none;
}
.pin-reveal{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  color:#fff;opacity:0;transition:opacity .15s;pointer-events:none;
}
.card.mode-left .del-reveal{opacity:1}
.card.mode-right .pin-reveal{opacity:1}
.card.mode-right{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.del-reveal svg,.pin-reveal svg{width:26px;height:26px}
.c-inner{
  position:relative;background:var(--panel);display:flex;gap:12px;
  padding:15px 16px 13px 18px;transition:transform .25s ease-out;
}
.card.swiping .c-inner{transition:none}
/* Lösch-Animation: flüssig von der Fingerposition bis ganz raus, dann Kollaps (kein Stillstand) */
@keyframes cardOut{
  0%{transform:translateX(var(--sx,0px))}
  70%{transform:translateX(-105%)}
  100%{transform:translateX(-105%)}
}
@keyframes cardCollapse{
  0%{height:var(--ch,140px);opacity:1;margin-bottom:10px;border-color:var(--border)}
  70%{height:var(--ch,140px);opacity:1;margin-bottom:10px}
  100%{height:0;opacity:0;margin-bottom:0;border-color:transparent}
}
.card.removing{overflow:hidden;animation:cardCollapse .6s cubic-bezier(.4,0,.2,1) forwards}
.card.removing .c-inner{animation:cardOut .6s cubic-bezier(.45,0,.25,1) forwards}

/* (Pin-Animation läuft jetzt als FLIP im JS – die Karte fliegt als Ganzes
   zur Angepinnt-Sektion und KOMMT dort an; kein Ausfaden mehr) */
.card .c-bar{position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0}
.c-body{flex:1;min-width:0}
.c-title{font-size:15.5px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px;padding-right:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-title.notitle{color:var(--faint);font-style:italic;font-weight:600}
.c-prev{font-size:13px;color:var(--muted);line-height:1.45;margin:0 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;align-items:center;gap:9px}
.c-date{font-size:11.5px;color:var(--faint);font-weight:600}
.c-pin{margin-left:auto;width:14px;height:14px;color:var(--accent);flex:none}
.c-pin svg{width:14px;height:14px;fill:currentColor}
.c-progress{width:52px;height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;flex:none;margin-left:auto}
.c-progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s var(--ease)}

.empty{text-align:center;padding:64px 26px;color:var(--muted)}
.empty .eico{
  width:88px;height:88px;border-radius:30px;margin:0 auto 18px;
  background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent2) 14%,var(--panel)));
  display:flex;align-items:center;justify-content:center;font-size:40px;
  box-shadow:var(--shadow);
}
.empty .eico svg{color:var(--accent);stroke-width:1.6}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.empty p{font-size:13.5px;margin:0 0 20px;line-height:1.6}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  border-radius:14px;padding:12px 20px;font-size:14px;font-weight:700;
  transition:transform .15s var(--ease),filter .15s;box-shadow:var(--shadow-sm);
}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;box-shadow:0 8px 20px rgba(99,102,241,.35)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn svg{width:17px;height:17px}

#fab{
  position:absolute;right:18px;bottom:calc(84px + var(--safe-b));z-index:30;
  width:58px;height:58px;border-radius:19px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(99,102,241,.45),0 2px 6px rgba(20,24,40,.15);
  transition:transform .18s var(--ease),box-shadow .18s;
}
#fab svg{width:26px;height:26px}
#fab:active{transform:scale(.88)}

/* ================= App-Feeling: Splash, Ripple, Pull-to-Refresh ================= */
/* Splash-Screen beim Start (wie eine native App) */
#splash{
  position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(160deg,var(--accent),var(--accent2));
  transition:opacity .45s ease,visibility .45s;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{
  width:88px;height:88px;border-radius:26px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 18px 46px rgba(0,0,0,.28);animation:splashPop .5s var(--ease);
}
.splash-logo svg{width:46px;height:46px}
.splash-name{color:#fff;font-size:23px;font-weight:800;letter-spacing:-.02em;animation:splashFade .6s .1s var(--ease) backwards}
@keyframes splashPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes splashFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Material-Ripple auf allen Touch-Elementen */
.card,.s-item,.sd-item,.sd-label,.btn,.chip,.d-act,.ibtn,.labelbtn,.cl-all,.cl-check,.cl-addbtn,.sd-add{
  position:relative;overflow:hidden;
}
.ripple-ink{
  position:absolute;border-radius:50%;background:currentColor;opacity:.08;
  transform:scale(0);animation:rippleIn .85s cubic-bezier(.22,.61,.36,1) forwards;
  pointer-events:none;z-index:2;
}
@keyframes rippleIn{to{transform:scale(1);opacity:0}}

/* Pull-to-Refresh */
#ptr{
  height:0;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:height .25s var(--ease);
}
.ptr-spin{
  width:28px;height:28px;border-radius:50%;
  border:3px solid var(--border2);border-top-color:var(--accent);
  opacity:0;transform:rotate(0deg);flex:none;
}
#ptr.active .ptr-spin{opacity:1;animation:ptrSpin .7s linear infinite}
@keyframes ptrSpin{to{transform:rotate(360deg)}}

/* ===== Papierkorb ===== */
.trash-head{
  display:flex;align-items:center;gap:10px;padding:6px 4px 12px;
}
.trash-head b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.trash-head .n{font-size:11px;color:var(--faint);font-weight:800;background:var(--panel3);border-radius:999px;padding:2px 9px}
.trash-head .sp{flex:1}
.card.trash-card{background:var(--panel)}
.card.trash-card .c-inner{background:var(--panel);padding-bottom:6px}
.t-actions{display:flex;gap:8px;margin-top:10px}
.t-actions .btn{flex:1;padding:9px 12px;font-size:13px;border-radius:12px}
.btn.restore{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.btn.del-forever{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}

/* Such-Treffer-Hervorhebung */
mark{background:rgba(250,204,21,.45);color:inherit;border-radius:3px;padding:0 1px}
.hits{
  flex:none;font-size:11px;font-weight:800;color:var(--accent);
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  border-radius:999px;padding:6px 11px;
}

/* Erster-Einstieg-Hinweis */
#hintTip{
  position:absolute;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);
  z-index:35;background:var(--panel);border:1px solid var(--border);border-radius:15px;
  box-shadow:var(--shadow-lg);padding:11px 18px;font-size:12.5px;font-weight:600;color:var(--muted);
  max-width:90%;text-align:center;pointer-events:none;animation:hintIn .45s var(--ease);
  white-space:nowrap;
}
@keyframes hintIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Karten-Entrance beim ersten Start (gestaffelt) */
#listWrap.fresh .card{animation:cardIn .38s var(--ease) backwards}
#listWrap.fresh .card:nth-child(2){animation-delay:.05s}
#listWrap.fresh .card:nth-child(3){animation-delay:.1s}
#listWrap.fresh .card:nth-child(4){animation-delay:.15s}
#listWrap.fresh .card:nth-child(5){animation-delay:.2s}
#listWrap.fresh .card:nth-child(6){animation-delay:.25s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= Seitenleiste (Drawer) ================= */
#sideBack{
  position:absolute;inset:0;z-index:44;background:rgba(10,12,20,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#sideBack.show{opacity:1;pointer-events:auto}
#sidebar{
  position:absolute;top:0;left:0;bottom:0;z-index:45;width:min(330px,88vw);
  background:var(--panel);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;
  transform:translateX(-105%);transition:transform .32s var(--ease);
}
#sidebar.open{transform:none}
.sd-head{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:calc(14px + var(--safe-t)) 12px 12px 18px;border-bottom:1px solid var(--border);
}
.sd-title{flex:1;font-size:17px;font-weight:800;letter-spacing:-.02em}
.sd-close{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sd-close:active{background:var(--panel3);transform:scale(.92)}
.sd-close svg{width:20px;height:20px}
.sd-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px calc(24px + var(--safe-b))}
.sd-sec{
  font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);padding:16px 8px 8px;
}
.sd-sep{height:1px;background:var(--border);margin:10px 8px}
.sd-label{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:13px;
  font-size:14px;font-weight:600;text-align:left;transition:background .15s;
}
.sd-label:active{background:var(--panel3)}
.sd-label.on{background:var(--accent-soft);color:var(--accent)}
.sd-label .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-label .cnt{
  font-size:11px;color:var(--faint);font-weight:800;background:var(--panel3);
  border-radius:999px;padding:2px 8px;
}
.sd-label .ed{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--faint);flex:none;
}
.sd-label .ed:active{background:var(--panel);color:var(--text)}
.sd-label .ed svg{width:15px;height:15px}
.sd-add{
  display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;
  border:1.5px dashed var(--border2);border-radius:13px;padding:11px 12px;
  font-size:13.5px;font-weight:700;color:var(--accent);transition:background .15s;
}
.sd-add:active{background:var(--accent-soft)}
.sd-add svg{width:17px;height:17px}
.sd-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border-radius:13px;
  font-size:14px;font-weight:600;text-align:left;transition:background .15s;
}
.sd-item:active{background:var(--panel3)}
.sd-item svg{width:20px;height:20px;color:var(--muted);flex:none}
.sd-item .sp{flex:1}
.sd-item .val{font-size:12px;color:var(--faint);font-weight:600}
.sd-item.danger{color:var(--danger)}
.sd-item.danger svg{color:var(--danger)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--border2)}
.dotbig{width:20px;height:20px;border-radius:7px;flex:none}

/* ================= Detailansicht ================= */
#detailView{
  position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  background:var(--bg);transform:translateX(100%);
  transition:transform .38s cubic-bezier(.22,1,.36,1), visibility .38s; /* federnder Einzug & Auszug */
  visibility:hidden;
}
#detailView.open{transform:none;visibility:visible}
.d-head{
  flex:none;padding:calc(10px + var(--safe-t)) 14px 6px;display:flex;align-items:center;gap:6px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);z-index:5;
}
#backBtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
#backBtn:active{background:var(--panel3);transform:scale(.9)}
#backBtn svg{width:22px;height:22px}
#noteTitle{
  flex:1;min-width:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.3;
  padding:6px 4px;color:var(--text);
}
#noteTitle::placeholder{color:var(--faint)}
#pinBtn{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;transition:all .15s}
#pinBtn:active{transform:scale(.88)}
#pinBtn svg{width:20px;height:20px}
#pinBtn.on{color:var(--accent)}
.d-meta{
  flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 18px 12px;border-bottom:1px solid var(--border);
}
.d-dates{font-size:11.5px;color:var(--faint);font-weight:600}
.d-meta .sp{flex:1}
.labelbtn{
  display:flex;align-items:center;gap:7px;flex:none;
  background:var(--panel);border:1px solid var(--border);border-radius:999px;
  padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--text);
  box-shadow:var(--shadow-sm);transition:transform .15s,border-color .15s;
}
.labelbtn:active{transform:scale(.94)}
.labelbtn:focus-visible{border-color:var(--accent)}

#sheetBack{

  opacity:0;pointer-events:none;transition:opacity .25s;
}
#sheetBack.show{opacity:1;pointer-events:auto}
#sheet{
  position:absolute;left:0;right:0;bottom:var(--kb,0px);z-index:51;

'use strict';
/* ============================================================
   Noteises – mobile Notizen & Checklisten
   Eine HTML-Datei · Service Worker · Export: TXT/MD/HTML/JSON
   ============================================================ */

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Such-Treffer im Text hervorheben (<mark>) – HTML-sicher */
function hl(text, q){
  const t = String(text);
  if(!q) return esc(t);
  const lower = t.toLowerCase(), lq = q.toLowerCase();
  let out = '', i = 0;
  while(i < t.length){
    const j = lower.indexOf(lq, i);
    if(j === -1){ out += esc(t.slice(i)); break; }
    out += esc(t.slice(i, j)) + '<mark>' + esc(t.slice(j, j + lq.length)) + '</mark>';
    i = j + lq.length;
  }
  return out;
}
function countMatches(text, q){
  if(!q) return 0;
  const lower = String(text).toLowerCase(), lq = q.toLowerCase();
  let c = 0, i = 0;
  while((i = lower.indexOf(lq, i)) !== -1){ c++; i += lq.length; }
  return c;
}

function loadData(){
  labels = DEFAULT_LABELS.map(l => ({ ...l }));
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){}
  if(raw){
    try {
      const data = JSON.parse(raw);
      if(data && Array.isArray(data.notes)){
        if(Array.isArray(data.labels) && data.labels.length) labels = data.labels.map(normalizeLabel);
        notes = data.notes.map(n => normalizeNote(n));
        return;
      }
    } catch(e){}
  }
  // Migration von Notizwerk v2
  try {
    const old = localStorage.getItem(LS_KEY_OLD);
    if(old){
      const data = JSON.parse(old);
      if(data && Array.isArray(data.notes)){
        notes = data.notes.map(n => normalizeNote(Object.assign({ type:'text', items:[] }, n)));
        saveNow();
        return;
      }
    }
  } catch(e){}
  notes = seedNotes().map(normalizeNote);
  purgeTrash();
}
function normalizeLabel(l){
  const c = String(l.color || '#6366f1');
  return {
    id:    String(l.id || uid()),
    name:  String(l.name || 'Label').slice(0, 24),
    color: /^#[0-9a-f]{6}$/i.test(c) ? c : '#6366f1'
  };
}
function normalizeNote(n){
  return {
    id:        String(n.id || uid()),
    title:     String(n.title || ''),
    text:      String(n.text || ''),
    // sessionNew wird bewusst NICHT übernommen → geladene Notizen sind "bestehend"
    type:      n.type === 'list' ? 'list' : 'text',
    items:     Array.isArray(n.items) ? n.items.map(i => ({
                 id: String(i.id || uid()),
                 t:  String(i.t || i.text || ''),
                 d:  !!i.d
               })).filter(i => i.t) : [],
    label:     labels.some(l => l.id === n.label) ? String(n.label) : '',
    pinned:    !!n.pinned,
    deletedAt: typeof n.deletedAt === 'number' ? n.deletedAt : null,
    createdAt: typeof n.createdAt === 'number' ? n.createdAt : now(),
    updatedAt: typeof n.updatedAt === 'number' ? n.updatedAt : now()
  };
}

function applyTheme(t, persist){
  document.documentElement.setAttribute('data-theme', t);
  $('#metaTheme').setAttribute('content', t === 'dark' ? '#0e1117' : '#f4f5fa');
  $('#sideThemeIco').innerHTML = t === 'dark' ? I.sun : I.moon;
  $('#sideThemeVal').textContent = t === 'dark' ? 'Dunkel' : 'Hell';
  if(persist){ try { localStorage.setItem(THEME_KEY, t); } catch(e){} }
}
function initTheme(){
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch(e){}
  if(!t){
    try { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(e){ t = 'light'; }
  }
  applyTheme(t === 'dark' ? 'dark' : 'light', false);
}

/* ---------- Helfer ---------- */
function fmtDate(ts){
  const d = new Date(ts), nd = new Date();
  const hm = d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
  if(d.toDateString() === nd.toDateString()) return 'Heute, ' + hm;
  const y = new Date(nd); y.setDate(nd.getDate() - 1);
  if(d.toDateString() === y.toDateString()) return 'Gestern, ' + hm;
  return d.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'2-digit' }) + ', ' + hm;
}
function wordCount(t){ const m = String(t).trim().match(/\S+/g); return m ? m.length : 0; }
function slugify(t){
  return String(t || '').toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'notiz';
}
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}
function download(filename, content, type){
  const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function vibrate(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

/* ---------- Toast ---------- */
function toast(msg, actionLabel, onAction, duration){
  const wrap = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span>' + esc(msg) + '</span>';
  if(actionLabel && onAction){
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.addEventListener('click', () => { onAction(); t.remove(); });
    t.appendChild(b);
  }
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, duration || 3800);
}

/* ---------- Bottom-Sheet ---------- */
function openSheet(title, items){
  $('#sheetTitle').textContent = title;
  const body = $('#sheetBody');
  body.innerHTML = '';
  body.scrollTop = 0;
  for(const it of items){
    if(it === '-'){
      const sep = document.createElement('div');
      sep.className = 's-sep';
      body.appendChild(sep);
      continue;
    }
    const b = document.createElement('button');
    b.className = 's-item' + (it.danger ? ' danger' : '') + (it.sel ? ' sel' : '');
    b.innerHTML =
      (it.icon ? it.icon : '<span class="s-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>') +
      '<span>' + esc(it.label) + (it.sub ? '<span class="sub">' + esc(it.sub) + '</span>' : '') + '</span>' +
      (it.value !== undefined ? '<span class="sp"></span><span style="color:var(--muted);font-size:13px">' + esc(it.value) + '</span>' : '');
    b.addEventListener('click', () => {
      if(it.fn) it.fn();
      if(!it.noClose) closeSheet(); // Punkte, die ein Unter-Sheet öffnen, offen lassen
    });
    body.appendChild(b);
  }
  showSheet();
}
function openSheetCustom(title, build, opts){
  opts = opts || {};
  $('#sheetTitle').textContent = title;
  const body = $('#sheetBody');
  body.innerHTML = '';
  body.scrollTop = 0;
  build(body);
  const sheet = $('#sheet');
  sheet.classList.toggle('sheet-input', !!opts.fullHeight);
  if(opts.fullHeight){
    // Inline-Werte löschen, damit die CSS-Regel (height:100%) wirklich greift
    sheet.style.maxHeight = '';
    sheet.style.bottom = '';
  }
  if(opts.focusInput){
    // Tastatur ZUERST öffnen, dann Sheet zeigen (nur noch von anderen Stellen genutzt)
    const inp = body.querySelector('input,textarea');
    if(inp) inp.focus();
    setTimeout(() => { syncKeyboard(); showSheet(); }, 200);
  } else {
    showSheet();
  }
}
function showSheet(){
  $('#sheet').style.transform = '';
  syncKeyboard(); // Sheet-Höhe an den sichtbaren Bereich anpassen
  $('#sheetBack').classList.add('show');
  $('#sheet').classList.add('show');
  document.body.classList.add('no-scroll');
  vibrate(6);
  pushOverlayState();
}
function closeSheet(){
  const sheet = $('#sheet');
  sheet.classList.remove('show');
  sheet.style.transform = '';
  // Eingabe-Sheet-Status zurücksetzen (nächstes Öffnen startet frisch)
  sheet.classList.remove('sheet-input');
  sheet.style.maxHeight = '';
  $('#sheetBack').classList.remove('show');
  document.body.classList.remove('no-scroll');
  // Tastatur sauber schließen, wenn das Eingabefeld im Sheet fokussiert war
  const ae = document.activeElement;
  if(ae && sheet.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) ae.blur();
}
$('#sheetBack').addEventListener('click', closeSheet);

/* Drag-to-close: überall auf dem Sheet nach unten ziehen (scroll-bewusst) */
function initSheetDrag(){
  const sheet = $('#sheet'), body = $('#sheetBody'), hint = $('#sheetHint');
  let drag = null;

  sheet.addEventListener('pointerdown', e => {
    if(!sheet.classList.contains('show')) return;
    if(e.target.closest('button,input,select,textarea,a')) return;
    if(body.scrollTop > 0) return; // Inhalt ist gescrollt → natives Scrollen zuerst
    drag = {
      startY: e.clientY, lastY: e.clientY,
      lastT: performance.now(), v: 0, dy: 0
    };
    sheet.style.transition = 'none';
    hint.textContent = 'Zum Schließen loslassen';
    try { sheet.setPointerCapture(e.pointerId); } catch(err){}
  });
  sheet.addEventListener('pointermove', e => {
    if(!drag) return;
    const t = performance.now();
    const dt = Math.max(1, t - drag.lastT);
    drag.v = (e.clientY - drag.lastY) / dt;
    drag.lastY = e.clientY; drag.lastT = t;
    if(body.scrollTop > 0){ drag = null; sheet.style.transform = ''; sheet.style.transition = ''; return; }
    let dy = e.clientY - drag.startY;
    if(dy < 0) dy *= 0.3;
    drag.dy = dy;
    sheet.style.transform = 'translateY(' + dy + 'px)';
  });
  const end = () => {
    if(!drag) return;
    const d = drag;
    drag = null;
    const h = sheet.offsetHeight || 400;
    const shouldClose = d.dy > 130 || d.dy > h * 0.3 || (d.dy > 50 && d.v > 0.6);
    sheet.style.transition = '';
    if(shouldClose){
      // closeSheet() übernimmt: weiches Wegschwingen, Klassen-Reset UND
      // das Schließen der Tastatur (Input-Blur), falls das Feld fokussiert war.
      closeSheet();
    } else {
      sheet.style.transform = '';
    }
    hint.textContent = 'Nach unten ziehen zum Schließen';
  };
  sheet.addEventListener('pointerup', end);
  sheet.addEventListener('pointercancel', end);
}

function renderSidebar(){

  wrap.innerHTML = '';
  const mk = (label, on) => {
    const row = document.createElement('div');
    row.className = 'sd-label' + (on ? ' on' : '');

      (!label || n.label === label) &&
      (!query.trim() || n.title.toLowerCase().includes(query.trim().toLowerCase()) ||
       n.text.toLowerCase().includes(query.trim().toLowerCase()) ||
       (n.items||[]).some(i => i.t.toLowerCase().includes(query.trim().toLowerCase())))
    ).length;
    row.innerHTML =

      if(e.target.closest('.ed')){
        openLabelForm(label);
        return;
      }
      labelFilter = (labelFilter === label) ? '' : label;
      trashView = false;
      renderSidebar();
      renderList();
    });
    wrap.appendChild(row);
  };
  mk('', !labelFilter);
  labels.forEach(l => mk(l.id, labelFilter === l.id));

  // Papierkorb-Zähler
  const tVal = $('#sideTrashVal');
  if(tVal) tVal.textContent = String(trashNotes().length);
  const tItem = $('#sideTrash');

/* ---------- Label-Verwaltung ---------- */
function openLabelForm(labelId){
  const editing = labelId ? getLabel(labelId) : null;
  // Kein Auto-Fokus: Das Menü fährt hoch (volle Höhe, oben bündig) und zeigt
  // Eingabefeld, Farben und Buttons auf einen Blick. Die Tastatur öffnet sich
  // erst, wenn man ins Feld tippt – das Menü verändert sich dabei überhaupt nicht.
  const open = openSheetCustom(editing ? 'Label bearbeiten' : 'Neues Label', body => {
    body.innerHTML =
      '<div class="lf-name"><input id="lfName" maxlength="24" placeholder="Label-Name (z. B. Urlaub, Arbeit, Familie)…" value="' + esc(editing ? editing.name : '') + '"></div>' +
      '<div class="lf-colors" id="lfColors"></div>' +
      '<div class="lf-actions">' +
        '<button class="btn primary" id="lfSave">Speichern</button>' +
        (editing ? '<button class="btn danger" id="lfDel">Löschen</button>' : '') +
      '</div>';
    let chosen = editing ? editing.color : LABEL_COLORS[0];
    const colors = $('#lfColors');
    const paint = () => {
      colors.innerHTML = '';
      for(const c of LABEL_COLORS){
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'lf-col' + (chosen === c ? ' on' : '');
        b.style.background = c;
        b.addEventListener('click', () => { chosen = c; paint(); });
        colors.appendChild(b);
      }
      const custom = document.createElement('input');
      custom.type = 'color';
      custom.className = 'lf-custom';
      custom.value = chosen;
      custom.title = 'Eigene Farbe';
      custom.addEventListener('input', () => { chosen = custom.value; paint(); });
      colors.appendChild(custom);
    };
    paint();
    $('#lfSave').addEventListener('click', () => {
      const name = $('#lfName').value.trim();
      if(!name){ $('#lfName').focus(); return; }
      if(editing){
        editing.name = name;
        editing.color = chosen;
      } else {
        labels.push({ id: uid(), name: name, color: chosen });
      }
      saveNow();
      renderSidebar();
      renderDetail();
      closeSheet();
      toast(editing ? '✓ Label aktualisiert' : '✓ Label „' + name + '“ erstellt');
    });
    if(editing){
      $('#lfDel').addEventListener('click', () => {
        notes.forEach(n => { if(n.label === editing.id) n.label = ''; });
        labels = labels.filter(l => l.id !== editing.id);
        if(labelFilter === editing.id) labelFilter = '';
        saveNow();
        renderSidebar();
        renderList();
        renderDetail();
        closeSheet();
        toast('Label „' + editing.name + '“ gelöscht');
      });
    }
  }, { fullHeight: true }); // volle Höhe, kein Auto-Fokus (Tastatur erst beim Tippen)
  void open;
}

function openLabelPicker(n){
  const items = [
    { label: 'Kein Label', sel: !n.label, fn: () => setLabelFor(n, '') }

      icon: '<span class="dot" style="width:20px;height:20px;background:' + l.color + '"></span>',
      label: l.name,
      sel: n.label === l.id,
      fn: () => setLabelFor(n, l.id)

  items.push('-');
  items.push({
    icon: I.tag, label: 'Labels verwalten', sub: 'Neu · umbenennen · löschen',
    fn: () => { closeSheet(); setTimeout(() => openSidebar(), 120); }
  });
  openSheet('Label wählen', items);
}

/* ---------- Liste ---------- */
function trashNotes(){
  return notes.filter(n => n.deletedAt).sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
}
function filteredNotes(){
  if(trashView) return trashNotes();
  const q = query.trim().toLowerCase();
  let list = notes.filter(n =>
    !n.deletedAt &&
    (!labelFilter || n.label === labelFilter) &&
    (!q || n.title.toLowerCase().includes(q) || n.text.toLowerCase().includes(q) ||
     (n.items||[]).some(i => i.t.toLowerCase().includes(q)))
  );
  list.sort((a, b) => {
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if(sortMode === 'title') return a.title.localeCompare(b.title, 'de');
    const k = sortMode === 'created' ? 'createdAt' : 'updatedAt';
    return b[k] - a[k];
  });
  return list;
}
function doneCount(n){ return (n.items || []).filter(i => i.d).length; }

function cardHTML(n){
  const lbl = getLabel(n.label);
  const done = doneCount(n);
  const title = n.title || 'Ohne Titel';
  let prev = '';
  const q = query.trim().toLowerCase();
  if(n.type === 'list'){
    prev = done + ' von ' + n.items.length + ' erledigt';
  } else {
    prev = n.text.replace(/\s+/g, ' ').trim().slice(0, 160);
  }
  return '<div class="del-reveal">' + I.trash + '</div>' +
    '<div class="pin-reveal">' + I.pin + '</div>' +
    '<div class="c-inner">' +
      (lbl ? '<div class="c-bar" style="background:' + lbl.color + '"></div>' : '') +
      '<div class="c-body">' +
        '<div class="c-title' + (n.title ? '' : ' notitle') + '">' + (q ? hl(title, q) : esc(title)) + '</div>' +
        (prev ? '<div class="c-prev">' + (q && n.type !== 'list' ? hl(prev, q) : esc(prev)) + '</div>' : '') +
        '<div class="c-meta">' +
          '<span class="c-date">' + fmtDate(n.updatedAt) + '</span>' +
          (n.type === 'list' && n.items.length ?
            '<span class="c-progress"><span style="width:' + Math.round(done / n.items.length * 100) + '%"></span></span>' : '') +
          (n.pinned ? '<span class="c-pin">' + I.pin + '</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
}

      '</div><b>Papierkorb ist leer</b>' +

function renderList(){
  const wrap = $('#listWrap');
  if(trashView){ renderTrash(); return; }
  const list = filteredNotes();
  wrap.innerHTML = '';

  if(!notes.length){
    wrap.innerHTML =
      '<div class="empty"><div class="eico">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>' +
      '</div><b>Noch keine Notizen</b>' +
      '<p>Erstelle deine erste Notiz oder Checkliste – alles bleibt auf diesem Gerät.</p>' +
      '<button class="btn primary" id="emptyNew">+ Neue Notiz</button></div>';
    $('#emptyNew').addEventListener('click', newNote);
    return;
  }
  if(!list.length){
    wrap.innerHTML =
      '<div class="empty"><div class="eico">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="width:40px;height:40px"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>' +
      '</div><b>Keine Treffer</b>' +
      '<p>Nichts passt zu deiner Suche oder dem gewählten Label.</p>' +
      '<button class="btn" id="emptyReset">Filter zurücksetzen</button></div>';
    $('#emptyReset').addEventListener('click', () => {
      $('#search').value = ''; query = '';
      labelFilter = '';
      $('#searchClear').style.display = 'none';
      renderSidebar();
      renderList();
    });
    return;
  }

  const pinned = list.filter(n => n.pinned);
  const rest   = list.filter(n => !n.pinned);
  const section = (arr, title) => {
    if(!arr.length) return;
    const h = document.createElement('div');
    h.className = 'sec-title';
    h.innerHTML = esc(title) + ' <span class="n">' + arr.length + '</span>';
    wrap.appendChild(h);
    for(const n of arr){
      const c = document.createElement('div');
      c.className = 'card';
      c.dataset.id = n.id;
      const inner = document.createElement('div');
      inner.innerHTML = cardHTML(n);
      const innerEl = inner.querySelector('.c-inner');
      const lbl = getLabel(n.label);
      if(lbl) innerEl.style.background = 'color-mix(in srgb, ' + lbl.color + ' 7%, var(--panel))';
      // Reveal-Flächen (Löschen/Pinnen) + Inhalt anhängen
      while(inner.firstElementChild) c.appendChild(inner.firstElementChild);
      bindCard(c, n);
      wrap.appendChild(c);
    }
  };
  section(pinned, 'Angepinnt');
  // Gruppierung "Heute / Gestern / Älter" (wie Apple Notizen) – außer bei A–Z-Sortierung
  if(sortMode === 'title'){
    section(rest, 'Alle Notizen');
  } else {
    const dayKey = ts => {
      const d = new Date(ts), nd = new Date();
      const d0 = new Date(nd.getFullYear(), nd.getMonth(), nd.getDate()).getTime();
      const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      const diff = Math.round((d0 - dd) / 864e5);
      return diff === 0 ? 'today' : diff === 1 ? 'yest' : 'old';
    };
    const groups = { today: [], yest: [], old: [] };
    rest.forEach(n => groups[dayKey(n.updatedAt)].push(n));
    section(groups.today, 'Heute');
    section(groups.yest, 'Gestern');
    section(groups.old, 'Älter');
  }
}

/* ---------- Karten-Interaktionen: flüssiges Wischen nach links (löschen) & rechts (pinnen) ---------- */
function bindCard(card, n){
  const inner = card.querySelector('.c-inner');
  let sx = 0, sy = 0, off = 0, lastV = 0, lastT = 0, lastX = 0;
  let dragging = false, longTimer = null, longFired = false, mode = null, springTimer = null;

  const W = () => card.offsetWidth || 420;
  const thrOff = () => Math.round(W() * 0.5);     // Anschlag bei 50%: ab da greift die Aktion, darunter federt es zurück

  const cancelLong = () => { if(longTimer){ clearTimeout(longTimer); longTimer = null; } };
  const clearMode = () => {
    mode = null;
    card.classList.remove('mode-left', 'mode-right');
  };

  card.addEventListener('pointerdown', e => {
    // Ausstehende Feder-Animation abbrechen (sonst würde sie die neue Geste stören)
    if(springTimer){ clearTimeout(springTimer); springTimer = null; }
    sx = e.clientX; sy = e.clientY; off = 0;
    lastX = e.clientX; lastT = performance.now(); lastV = 0;
    dragging = true; longFired = false; mode = null;
    inner.style.transition = 'none';
    card.classList.add('swiping');
    longTimer = setTimeout(() => {
      longTimer = null;
      if(dragging && Math.abs(e.clientX - sx) < 8 && Math.abs(e.clientY - sy) < 8){
        longFired = true;
        dragging = false;                       // Geste ist beendet (Menü offen)
        card.classList.remove('swiping');
        clearMode();
        vibrate(12);
        openCardMenu(n);
        swallowNextClick();                     // synthetischen Klick beim Loslassen schlucken
      }
    }, 480);
  });
  card.addEventListener('pointermove', e => {
    if(!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) > 10 || Math.abs(dy) > 10) cancelLong();
    if(Math.abs(dx) < Math.abs(dy)) return;     // vertikal: natives Scrollen
    // Richtung beim ersten Ausschlag festlegen (danach fixiert)
    if(mode === null){
      if(dx < -8) mode = 'left';
      else if(dx > 8) mode = 'right';
      else return;
      card.classList.add(mode === 'left' ? 'mode-left' : 'mode-right');
    }
    const t = performance.now();
    const dt = Math.max(1, t - lastT);
    lastV = (e.clientX - lastX) / dt;
    lastX = e.clientX; lastT = t;
    // Harte Anschläge bei 50% (kein Gummiband): links = löschen, rechts = anpinnen
    const lim = thrOff();
    let o;
    if(mode === 'left') o = Math.max(dx, -lim);
    else o = Math.min(dx, lim);
    off = o;
    inner.style.transform = 'translateX(' + o + 'px)';
    card.style.setProperty('--sx', o + 'px');
  });
  const up = e => {
    if(!dragging) return;
    dragging = false;
    cancelLong();
    card.classList.remove('swiping');
    if(longFired){ clearMode(); return; }
    if(mode === null){
      // Tippen (keine Bewegung) = Notiz öffnen
      if(Math.abs(e.clientX - sx) < 10 && Math.abs(e.clientY - sy) < 10) openNote(n.id);
      clearMode();
      return;
    }

    if(mode === 'left'){
      // Fling: schneller Wisch, aber physikalisch plausibel (obere Grenze gegen Ausreißer)
      const fling = off < -40 && lastV < -0.6 && lastV > -5;
      if(off <= -thrOff() || fling){
        hideHint();
        deleteNote(n, card);
        return;
      }
    } else { // right → anpinnen
      const fling = off > 40 && lastV > 0.6 && lastV < 5;
      if(off >= thrOff() || fling){
        hideHint();
        togglePinState(n);
        vibrate(10);
        toast(n.pinned ? '📌 Angepinnt' : 'Pin gelöst');
        animateCardPin(n.id);
        return;
      }
    }
    // Zurückfedern (weich, in einem Zug)
    inner.style.transition = 'transform .32s cubic-bezier(.32,.72,0,1)';
    inner.style.transform = 'translateX(0)';
    // Hintergrund (rot/indigo) erst NACH der Feder-Animation zurücksetzen –
    // sonst wird z. B. die violette Pin-Fläche beim Abbruch kurz rot (Bug).
    springTimer = setTimeout(() => {
      inner.style.transition = '';
      clearMode();
      springTimer = null;
    }, 360);
    // Tippen = Notiz öffnen
    if(Math.abs(off) < 8 && Math.abs(e.clientX - sx) < 10 && Math.abs(e.clientY - sy) < 10){
      openNote(n.id);
    }
  };
  card.addEventListener('pointerup', up);
  card.addEventListener('pointercancel', up);
  card.addEventListener('contextmenu', e => e.preventDefault());
}

/* Wischen nach rechts = Notiz anpinnen (mit Feedback + Animation wie beim Löschen) */
function togglePinState(n){
  n.pinned = !n.pinned;
  n.updatedAt = now();
  markDirty();
}
/* Anpinnen: die Karte fliegt als GANZE Karte zu ihrer Zielposition
   (oben in der "Angepinnt"-Sektion) und KOMMT dort an – ohne Ausfaden.
   Technik: FLIP – alte Position merken, neu rendern, dann per Transform
   alle Karten von der alten in die neue Position animieren. */
function animateCardPin(id){
  const listWrap = $('#listWrap');
  const oldRects = {};
  listWrap.querySelectorAll('.card').forEach(c => {
    try { oldRects[c.dataset.id] = c.getBoundingClientRect(); } catch(e){}
  });

  renderList(); // Notiz ist bereits als angepinnt gespeichert → erscheint oben

  const anims = [];
  listWrap.querySelectorAll('.card').forEach(c => {
    const or = oldRects[c.dataset.id];
    if(!or) return;
    let nr;
    try { nr = c.getBoundingClientRect(); } catch(e){ return; }
    const dx = or.left - nr.left, dy = or.top - nr.top;
    if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    c.style.transition = 'none';
    c.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    anims.push({ c, dx, dy });
  });
  if(!anims.length) return true;
  void listWrap.offsetHeight; // Reflow erzwingen
  anims.forEach(a => {
    a.c.style.transition = 'transform .5s cubic-bezier(.22,1,.36,1)';
    a.c.style.transform = '';
  });
  setTimeout(() => {
    anims.forEach(a => { a.c.style.transition = ''; a.c.style.transform = ''; });
  }, 550);
  return true;
}

/* Nach einem Langdruck den automatischen "Klick" beim Finger-Loslassen schlucken,
   damit er nicht versehentlich einen Menüpunkt auslöst (echte Geräte). */
let swallowHandler = null, swallowUntil = 0;
function swallowNextClick(){
  const until = Date.now() + 500;
  swallowUntil = until;
  if(swallowHandler) return;
  // NUR den Phantom-Klick auf der KARTE schlucken (der beim Loslassen nach einem
  // Langdruck automatisch feuert) – Klicks aufs gerade geöffnete Menü bleiben frei.
  swallowHandler = e => {
    if(e.isTrusted === false) return; // Tests/Skripte nicht beeinflussen
    if(!(e.target && e.target.closest && e.target.closest('.card'))) return;
    if(Date.now() < swallowUntil){
      e.stopPropagation();
      e.preventDefault();
      document.removeEventListener('click', swallowHandler, true);
      swallowHandler = null;
    }
  };
  document.addEventListener('click', swallowHandler, true);
  setTimeout(() => {
    if(swallowHandler){
      document.removeEventListener('click', swallowHandler, true);
      swallowHandler = null;
    }
  }, 600);
}

function openCardMenu(n){
  const lbl = getLabel(n.label);
  openSheet(n.title || 'Ohne Titel', [
    { icon: I.edit, label:'Öffnen', fn: () => openNote(n.id) },
    { icon: n.pinned ? I.pinOff : I.pin, label: n.pinned ? 'Anheften lösen' : 'Anheften', fn: () => togglePin(n) },
      { icon: '<span class="dot" style="width:20px;height:20px;background:' + (lbl ? lbl.color : 'var(--border2)') + '"></span>', label: 'Label: ' + (lbl ? lbl.name : 'Keines'), sub:'Eigenes Label zuweisen', fn: () => openLabelPicker(n), noClose: true },
      { icon: I.dl, label:'Exportieren', sub:'TXT · Markdown · HTML · JSON', fn: () => openExportSheet(n), noClose: true },
    '-',
    { icon: I.trash, label:'Löschen', danger:true, fn: () => deleteNote(n) }
  ]);
}

/* ---------- Aktionen ---------- */
function currentNote(){ return notes.find(n => n.id === currentId) || null; }

function newNote(){
  saveNow();
  const n = {
    id: uid(), title: '', text: '', type: 'text', items: [],
    label: '', pinned: false, createdAt: now(), updatedAt: now()
  };
  n.sessionNew = true; // in dieser Sitzung erstellt → Drucken bleibt ausgeblendet
  notes.unshift(n);
  currentId = n.id;
  renderList();
  openNote(n.id, true);
}
function openNote(id, fresh){
  hideHint();
  saveNow();
  currentId = id;
  const dv = $('#detailView');
  // Inline-Reste aus Gesten/abgebrochenen Animationen entfernen
  dv.style.transform = '';
  dv.style.transition = '';
  // Wurde gerade geschlossen (Slide-Out noch am Laufen), Animation sauber neu starten –
  // sonst bleibt die Ansicht sonst halb-geshiftet stehen (ganzer Bildschirm "nach rechts")
  if(dv.dataset.closed === '1'){
    dv.dataset.closed = '';
    dv.classList.remove('open');
    void dv.offsetHeight; // Reflow erzwingen → Slide-In startet garantiert von rechts
  }
  renderList();
  renderDetail();
  dv.classList.add('open');
  dv.setAttribute('aria-hidden', 'false');
  pushOverlayState();
  if(fresh){
    setTimeout(() => $('#noteTitle').focus(), 380);
  } else {
    setTimeout(() => { try { dv.querySelector('.d-scroll').scrollTop = 0; } catch(e){} }, 60);
  }
}
function closeDetail(){
  saveNow();
  const dv = $('#detailView');
  dv.style.transform = '';
  dv.style.transition = '';
  dv.dataset.closed = '1'; // openNote kann die Slide-Animation sauber neu starten
  dv.classList.remove('open');
  dv.setAttribute('aria-hidden', 'true');
  currentId = null;
  // Tastatur sauber schließen (verhindert Viewport-Ruckeln beim schnellen Zurück)
  const ae = document.activeElement;
  if(ae && dv.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) ae.blur();
  renderList();
  setTimeout(() => { if(!currentId) renderDetail(); }, 330);
}
function togglePin(n){
  n.pinned = !n.pinned;
  n.updatedAt = now();
  markDirty();
  renderList();
  renderDetail();
}

/* Löschen: eine durchgehende Animation (Gleiten + Kollaps starten gleichzeitig) */
function animateCardDelete(id){
  const card = document.querySelector('.card[data-id="' + id + '"]');
  if(!card) return false;
  const inner = card.querySelector('.c-inner');
  if(inner) inner.style.transition = '';          // Reste vom Ziehen entfernen (kein Ruckeln)
  card.style.setProperty('--ch', card.offsetHeight + 'px');
  card.classList.add('swiping', 'removing');
  setTimeout(() => { card.remove(); renderList(); }, 650);
  return true;
}
function deleteNote(n, cardEl){
  if(deletePending && deletePending.id !== n.id){
    clearTimeout(deletePending.timer);
    deletePending = null;
  }
  n.deletedAt = now(); // → Papierkorb (statt sofort zu entfernen)
  saveNow();
  purgeTrash();
  const wasOpen = currentId === n.id && $('#detailView').classList.contains('open');

  if(wasOpen) closeDetail();
  // Animation starten; ist die Karte gerade nicht in der Liste (z. B. durch
  // Suche/Filter ausgeblendet), Liste sofort neu rendern, damit kein Geist bleibt
  if(!animateCardDelete(n.id) && !wasOpen) renderList();
  renderSidebar(); // Papierkorb-Zähler aktualisieren

  vibrate(18);

  deletePending = { id: n.id };
  const timer = setTimeout(() => {
    if(deletePending && deletePending.id === n.id) deletePending = null;
  }, 5000);
  deletePending.timer = timer;

  toast('Notiz in den Papierkorb gelegt', 'Rückgängig', () => {
    clearTimeout(timer);
    if(deletePending && deletePending.id === n.id) deletePending = null;
    n.deletedAt = null; // wiederherstellen
    renderList();
    renderSidebar();
    if(wasOpen){
      currentId = n.id;
      renderDetail();
      $('#detailView').classList.add('open');
      $('#detailView').setAttribute('aria-hidden', 'false');
    }
  });
}
/* Endgültig löschen (nur aus dem Papierkorb) */
function deleteForever(n){
  notes = notes.filter(x => x.id !== n.id);
  saveNow(); // direkt speichern (purgeTrash sieht die Änderung sonst nicht)
  if(!trashNotes().length) trashView = false; // Papierkorb leer → zurück zur Liste
  renderList();
  renderSidebar();
  toast('Endgültig gelöscht');
}
function restoreNote(n){
  n.deletedAt = null;
  n.updatedAt = now();
  if(!trashNotes().length) trashView = false; // Papierkorb leer → zurück zur Liste
  saveNow();
  renderList();
  renderSidebar();
  toast('Notiz wiederhergestellt');
}
/* Alte Papierkorb-Einträge (>30 Tage) automatisch entfernen */
function purgeTrash(){
  const cut = now() - 30 * 24 * 3600 * 1000;
  const before = notes.length;
  notes = notes.filter(n => !n.deletedAt || n.deletedAt > cut);
  if(notes.length !== before) saveNow();
}

/* ---------- Detail rendern ---------- */
function renderDetail(){
  const n = currentNote();
  if(!n){
    $('#noteTitle').value = '';
    $('#noteText').value = '';
    $('#noteText').hidden = false;
    $('#listEditor').hidden = true;
    return;
  }
  switching = true;
  $('#noteTitle').value = n.title;
  switching = false;
  // Datum: nur "Bearbeitet" anzeigen, wenn sich Erstellt- und Bearbeitet-Datum unterscheiden
  const dC = fmtDate(n.createdAt), dU = fmtDate(n.updatedAt);
  $('#dates').textContent = dC === dU
    ? 'Erstellt ' + dC
    : 'Erstellt ' + dC + ' · Bearbeitet ' + dU;
  $('#pinBtn').innerHTML = n.pinned ? I.pin : I.pinOff;
  $('#pinBtn').classList.toggle('on', n.pinned);
  const dPinIco = $('#dPin .ico');
  dPinIco.innerHTML = n.pinned ? I.pin : I.pinOff;
  $('#dPin').classList.toggle('on', n.pinned);

  // Label-Button
  const lbl = getLabel(n.label);
  $('#labelBtnDot').style.background = lbl ? lbl.color : 'var(--border2)';
  $('#labelBtnText').textContent = lbl ? lbl.name : 'Kein Label';

  // Such-Treffer-Chip
  const chip = $('#hitsChip');
  if(chip){
    const q2 = query.trim();
    if(q2){
      const hits = countMatches(n.title, q2) + countMatches(n.text, q2) +
        (n.items || []).reduce((s, i) => s + countMatches(i.t, q2), 0);
      chip.textContent = '🔍 ' + hits + (hits === 1 ? ' Treffer' : ' Treffer');
      chip.hidden = hits === 0;
    } else {
      chip.hidden = true;
    }
  }

  // Typ-Segment
  $$('#typeSeg button').forEach(b => b.classList.toggle('on', b.dataset.type === n.type));
  const isList = n.type === 'list';
  $('#noteText').hidden = isList;
  $('#listEditor').hidden = !isList;
  if(!isList){
    $('#noteText').value = n.text;
    autosizeText();
  } else {
    renderItems();
  }
}
function autosizeText(){
  const ta = $('#noteText');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight + 2, window.innerHeight * 0.6) + 'px';
}

/* ---------- Checkliste ---------- */
function renderItems(){
  const n = currentNote();
  if(!n || n.type !== 'list') return;
  const wrap = $('#clItems');
  wrap.innerHTML = '';
  for(const it of n.items){
    const row = document.createElement('div');
    row.className = 'cl-row' + (it.d ? ' done' : '');
    row.dataset.id = it.id;
    row.innerHTML =
      '<button class="cl-check" aria-label="Abhaken">' + I.check + '</button>' +
      '<input class="cl-text" value="' + esc(it.t) + '" maxlength="200">' +
      '<button class="cl-del" aria-label="Element löschen">' + I.trash + '</button>';
    row.querySelector('.cl-check').addEventListener('click', () => toggleItem(n, it.id));
    const ti = row.querySelector('.cl-text');
    ti.addEventListener('input', () => {
      it.t = ti.value;
      n.updatedAt = now();
      markDirty();
    });
    ti.addEventListener('focus', () => row.classList.add('focused'));
    ti.addEventListener('blur', () => row.classList.remove('focused'));
    ti.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); $('#clNew').focus(); }
    });
    row.querySelector('.cl-del').addEventListener('click', () => {
      n.items = n.items.filter(x => x.id !== it.id);
      n.updatedAt = now();
      markDirty();
      renderItems();
    });
    wrap.appendChild(row);
  }
  const done = doneCount(n), total = n.items.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $('#clPct').textContent = pct + '%';
  $('#clStats').textContent = done + ' von ' + total + ' erledigt';
  const ring = $('.cl-ring');
  ring.style.setProperty('--p', pct);
  $('#clToggleAll').textContent = done === total ? 'Alle abwählen' : 'Alle abhaken';
  $('#clToggleAll').style.display = total ? '' : 'none';
}
function toggleItem(n, id){
  const it = n.items.find(x => x.id === id);
  if(!it) return;
  it.d = !it.d;
  n.updatedAt = now();
  markDirty();
  vibrate(8);
  renderItems();
}
function addItem(n, text){
  text = String(text || '').trim();
  if(!text) return false;
  n.items.push({ id: uid(), t: text, d: false });
  n.updatedAt = now();
  markDirty();
  renderItems();
  return true;
}

function exportJSON(n){

function copyText(t, label){
  let ok = false;
  const done = () => toast(ok ? '✓ ' + label + ' kopiert' : '⚠ Kopieren nicht möglich');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(() => { ok = true; done(); }).catch(() => done());
  } else {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
    done();
  }
}
function shareNote(n){
  const body = n.type === 'list' ? itemsToTXT(n) : n.text;
  const text = (n.title || 'Ohne Titel') + '\n\n' + body;
  if(navigator.share){
    navigator.share({ title: n.title || 'Noteises', text }).catch(() => {});
  } else {
    copyText(text, 'Notiz');
  }
}

/* ---------- Import ---------- */
function handleImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if(!data || !['notizwerk','noteises'].includes(data.app) || !Array.isArray(data.notes)){
        toast('⚠ Keine gültige Noteises-Sicherung');
        return;
      }
      const oldCount = notes.length;
      if(!confirm('Sicherung importieren?\n\n' + data.notes.length + ' Notiz(en) werden geladen und ersetzen die vorhandenen ' + oldCount + ' Notiz(en).')) return;
      if(Array.isArray(data.labels) && data.labels.length) labels = data.labels.map(normalizeLabel);
      notes = data.notes.map(normalizeNote);
      if(currentId) closeDetail();
      currentId = notes.length ? notes[0].id : null;
      saveNow();
      renderSidebar();
      renderList();
      renderDetail();
      toast('✓ ' + notes.length + ' Notizen importiert');
    } catch(e){
      toast('⚠ Datei konnte nicht gelesen werden');
    }
  };
  fr.onerror = () => toast('⚠ Datei konnte nicht gelesen werden');
  fr.readAsText(file);
}

/* ---------- Tastatur: Felder immer sichtbar halten ---------- */
let fullH = null; // volle Höhe ohne Tastatur (einmal ermittelt, nie geschrumpft)
let VV = null;    // visualViewport (global, für Einfrieren der Label-Sheets)

function syncKeyboard(){
  const vv = window.visualViewport;
  if(!vv) return;
  if(fullH === null || vv.height >= fullH - 1){
    fullH = Math.max(window.innerHeight || 0, vv.height);
  }
  const kb = Math.max(0, fullH - vv.height);
  document.documentElement.style.setProperty('--kb', kb + 'px');
  // FAB bei offener Tastatur ausblenden (wie bei nativen Apps)
  $('#fab').classList.toggle('hidden', kb > 0);

  // Sheet-Höhe an den sichtbaren Bereich koppeln – AUSSER bei Eingabe-Sheets
  // (Label-Formular): die haben fest 100% Höhe & oben bündig, damit sich nichts
  // bewegt, wenn die Tastatur auf- oder zufährt.
  const sheet = $('#sheet');
  if(!sheet.classList.contains('sheet-input')){
    const visible = vv.height || fullH;
    sheet.style.maxHeight = Math.round(visible * 0.96) + 'px';
  }

  const el = document.activeElement;
  if(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')){
    clearTimeout(syncKeyboard._t);
    syncKeyboard._t = setTimeout(() => {
      if(typeof el.scrollIntoView === 'function'){
        try { el.scrollIntoView({ block:'nearest' }); } catch(e){ el.scrollIntoView(); }
      }
    }, 80);
  }
}

function initKeyboard(){
  VV = window.visualViewport;
  const vv = VV;
  if(!vv) return;
  vv.addEventListener('resize', syncKeyboard);
  vv.addEventListener('scroll', syncKeyboard);
  window.addEventListener('resize', syncKeyboard);
  syncKeyboard();
  // Bei Fokus-Wechsel sofort ins Bild scrollen
  document.addEventListener('focusin', e => {
    const el = e.target;
    if(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')){
      setTimeout(() => {
        if(typeof el.scrollIntoView === 'function'){
          try { el.scrollIntoView({ block:'nearest' }); } catch(e){ el.scrollIntoView(); }
        }
      }, 120);
    }
  }, true);
}

function initBackHandler(){

/* Seitenleiste per Edge-Swipe vom linken Rand öffnen (Gmail-Stil) */
function initEdgeGestures(){
  const app = $('#app');
  let g = null;
  app.addEventListener('pointerdown', e => {
    if($('#detailView').classList.contains('open')) return;
    if($('#sidebar').classList.contains('open') || $('#sheet').classList.contains('show')) return;
    if(e.target.closest && e.target.closest('.card,button,input,textarea,select')) return;
    if(e.clientX > 30) return; // nur linker Rand
    g = { x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 };
  });
  // Verwaiste Gesten (Finger außerhalb losgelassen) nie hängen lassen
  document.addEventListener('pointerup', () => { g = null; });
  document.addEventListener('pointercancel', () => { g = null; });
  app.addEventListener('pointermove', e => {
    if(!g) return;
    g.dx = e.clientX - g.x0;
    g.dy = e.clientY - g.y0;
  });
  const end = () => {
    if(!g) return;
    const d = g; g = null;
    if(d.dx > 80 && Math.abs(d.dx) > Math.abs(d.dy) * 1.4) openSidebar();
  };
  app.addEventListener('pointerup', end);
  app.addEventListener('pointercancel', end);
}
/* Zurück-Swipe im Editor (iOS-Feeling): am linken Rand nach rechts ziehen */
function initEditorBackSwipe(){
  const dv = $('#detailView');
  let g = null;
  const reset = () => {
    g = null;
    if(dv.style.transform) dv.style.transform = '';
    if(dv.style.transition) dv.style.transition = '';
  };
  dv.addEventListener('pointerdown', e => {
    if(!dv.classList.contains('open')) return;
    if(e.target.closest && e.target.closest('textarea,input,select,button')) return;
    if(e.clientX > 34) return;
    g = { x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 };
    try { dv.setPointerCapture(e.pointerId); } catch(err){}
  });
  dv.addEventListener('pointermove', e => {
    if(!g) return;
    g.dx = e.clientX - g.x0;
    g.dy = e.clientY - g.y0;
    if(g.dx > 0 && Math.abs(g.dx) > Math.abs(g.dy)){
      dv.style.transition = 'none';
      dv.style.transform = 'translateX(' + Math.min(g.dx, 110) + 'px)';
    }
  });
  const end = () => {
    if(!g){ reset(); return; }
    const d = g; g = null;
    dv.style.transition = '';
    dv.style.transform = '';
    if(d.dx > 90 && Math.abs(d.dx) > Math.abs(d.dy) * 1.4) closeDetail();
  };
  dv.addEventListener('pointerup', end);
  dv.addEventListener('pointercancel', end);
  dv.addEventListener('lostpointercapture', end);
  // Sicherheitsnetz: Egal wo der Finger losgelassen wird – am #detailView darf NIE
  // eine Transform hängen bleiben (Bug: "ganzer Bildschirm steht nach rechts").
  document.addEventListener('pointerup', () => { if(dv.style.transform) dv.style.transform = ''; });
  document.addEventListener('pointercancel', () => { if(dv.style.transform) dv.style.transform = ''; });
}

function initPullToRefresh(){
  const list = $('#listView'), ptr = $('#ptr');
  if(!list || !ptr) return;
  let pulling = false, startY = 0, pull = 0;
  list.addEventListener('pointerdown', e => {
    if(list.scrollTop > 0) return;
    if(e.target.closest && e.target.closest('.card')) return;
    pulling = true; startY = e.clientY; pull = 0;
    try { list.setPointerCapture(e.pointerId); } catch(err){}
  });
  list.addEventListener('pointermove', e => {
    if(!pulling) return;
    const dy = e.clientY - startY;
    if(dy <= 0){ ptr.style.height = '0px'; pull = 0; return; }
    pull = Math.min(dy * 0.5, 90);
    ptr.style.height = pull + 'px';
    ptr.querySelector('.ptr-spin').style.transform = 'rotate(' + (pull * 4) + 'deg)';
  });
  const end = () => {
    if(!pulling) return;
    pulling = false;
    if(pull >= 70){
      ptr.classList.add('active');
      ptr.style.height = '56px';
      vibrate(10);
      setTimeout(() => {
        ptr.classList.remove('active');
        ptr.style.height = '0px';
        renderList();
        renderSidebar();
        saveNow();
      }, 650);
    } else {
      ptr.style.height = '0px';
    }
    pull = 0;
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
}

function initRipple(){
  let last = null; // {ink, x, y}
  const RIPPLE_SEL = '.card,.s-item,.sd-item,.sd-label,.btn,.chip,.d-act,.ibtn,.labelbtn,.cl-all,.cl-check,.cl-addbtn,.sd-add';
  document.addEventListener('pointerdown', e => {
    if(e.button && e.button !== 0) return;
    if(!e.target.closest) return;
    const el = e.target.closest(RIPPLE_SEL);
    if(!el) return;
    // Klein & dezent: nur ~70% der Elementgröße
    const r = el.getBoundingClientRect();
    const d = Math.max(r.width, r.height) * 0.7;
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const ink = document.createElement('span');
    ink.className = 'ripple-ink';
    ink.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (x - d / 2) + 'px;top:' + (y - d / 2) + 'px';
    el.appendChild(ink);
    setTimeout(() => ink.remove(), 900);
    last = { ink, x: e.clientX, y: e.clientY };
  }, true);
  // Beim Scrollen (Finger bewegt sich) Ripple sofort entfernen – nur echte Taps zeigen ihn
  document.addEventListener('pointermove', e => {
    if(!last) return;
    if(Math.abs(e.clientX - last.x) > 12 || Math.abs(e.clientY - last.y) > 12){
      last.ink.remove();
      last = null;
    }
  }, true);
  document.addEventListener('pointerup', () => { last = null; }, true);
  document.addEventListener('pointercancel', () => { last = null; }, true);
}

function initConnectivity(){
  window.addEventListener('offline', () => toast('📴 Offline – alles bleibt lokal gespeichert'));
  window.addEventListener('online', () => toast('📶 Wieder online'));
}

/* ---------- Service Worker & Installation ---------- */
function initSW(){
  if(!('serviceWorker' in navigator)) return;
  if(!/^https?:$/.test(location.protocol)) return; // file:// → kein SW möglich
  navigator.serviceWorker.register('./noteises-sw.js').catch(() => {});
}
function initInstall(){
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    $('#sideInstall').hidden = false;
    toast('⬇️ Noteises als App installieren?', 'Installieren', async () => {
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice.catch(() => ({ outcome:'dismissed' }));
      if(choice.outcome === 'accepted') toast('✓ Noteises wird installiert');
      deferredPrompt = null;
      $('#sideInstall').hidden = true;
    }, 9000);
  });
  window.addEventListener('appinstalled', () => {
    toast('✓ Noteises ist auf deinem Gerät installiert');
  });
}

/* ---------- Text von anderen Apps empfangen (Share-Target) ---------- */
let sharedHandled = false;

function handleSharedText(data){
  if(sharedHandled) return;
  sharedHandled = true;
  const title = String(data.title || '').trim();
  const text = String(data.text || '').trim();
  const url = String(data.url || '').trim();
  const full = text + (url && !text.includes(url) ? '\n' + url : '');
  if(!title && !full){ sharedHandled = false; return; }

  // URL bereinigen (Share-Parameter raus)
  try { history.replaceState({}, '', location.pathname); } catch(e){}

  openSheet('Notiz empfangen', []);
  const body = $('#sheetBody');
  body.innerHTML =
    '<div class="lf-name" style="padding-bottom:6px">' +
      '<textarea id="sharePreview" rows="5" readonly style="width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px;color:var(--text);line-height:1.5;resize:none">' + esc(full || title) + '</textarea>' +
    '</div>' +
    '<div class="lf-actions">' +
      '<button class="btn primary" id="shareSave">Als Notiz speichern</button>' +
      '<button class="btn" id="shareDiscard">Verwerfen</button>' +
    '</div>';
  $('#shareSave').addEventListener('click', () => {
    const n = {
      id: uid(), title: title || '', text: full, type: 'text', items: [],
      label: '', pinned: false, createdAt: now(), updatedAt: now(),
      sessionNew: true
    };
    notes.unshift(n);
    currentId = n.id;
    saveNow();
    closeSheet();
    renderList();
    renderSidebar();
    openNote(n.id, false);
    toast('✓ Notiz aus geteiltem Text erstellt');
  });
  $('#shareDiscard').addEventListener('click', () => {
    closeSheet();
    toast('Geteilten Text verworfen');
  });
}
function initShareTarget(){
  // Nachricht vom Service Worker (POST-Share-Target)
  window.addEventListener('message', e => {
    if(e.data && e.data.type === 'noteises-share') handleSharedText(e.data);
  });
  // GET-Fallback (manche Browser/Plattformen) + App-Shortcuts (?new=1)
  try {
    const p = new URLSearchParams(location.search);
    if(p.has('text')) handleSharedText({ title: p.get('title') || '', text: p.get('text') || '', url: p.get('url') || '' });
    else if(p.has('new')){
      try { history.replaceState({}, '', location.pathname); } catch(e){}
      const type = p.get('type');
      setTimeout(() => {
        newNote();
        if(type === 'list'){
          const n = currentNote();
          if(n){ n.type = 'list'; renderDetail(); }
        }
      }, 700); // nach Splash
    }
  } catch(e){}
}

/* ---------- Start ---------- */
function init(){
  initTheme();
  loadData();
  bindEvents();
  initSheetDrag();
  initKeyboard();
  initPullToRefresh();
  initRipple();
  initConnectivity();
  initBackHandler();
  initEdgeGestures();
  initEditorBackSwipe();
  initSplash();
  initHint();
  initSW();
  initInstall();
  initShareTarget();
  renderSidebar();
  renderList();
  renderDetail();
  // Gestaffelter Karten-Einblend-Effekt beim ersten Start
  const lw = $('#listWrap');
  lw.classList.add('fresh');
  setTimeout(() => lw.classList.remove('fresh'), 900);
}
if(typeof document !== 'undefined' && document.getElementById){
  init();
}
</script>
